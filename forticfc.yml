- name: GETTING CONFIGURATION BACKUP
  hosts: FORTIGATE_CFC
  gather_facts: false
  connection: local

  vars:
    backup_dir: "/home/dxc-network/Bureau"

  tasks:
    - name: Get FortiGate configuration backup
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:{{ forti_port }}/api/v2/monitor/system/config/backup?scope=global"
        method: POST
        headers:
          Authorization: "Bearer {{ api_key }}"
        validate_certs: false
        return_content: true
      register: fgt_config
      changed_when: false
      no_log: true
    
    - name: Save configuration backup
      ansible.builtin.copy:
        content: "{{ fgt_config.content }}"
        dest: "{{ backup_dir }}/FG-DC-CONFIG_{{ lookup('pipe', 'date +%Y-%m-%d_%H-%M-%S') }}.conf"
        mode: "0640"
