- name: GETTING CONFIGURATION BACKUP
  hosts: FORTIGATE_DC
  gather_facts: false
  vars:
    ansible_connection: ansible.netcommon.httpapi
    ansible_network_os: fortinet.fortios.fortios
    ansible_httpapi_use_ssl: true
    ansible_httpapi_validate_certs: false
    ansible_command_timeout: 90

  tasks:
    - name: Run show full-configuration on FortiGate
      ansible.netcommon.cli_command:
        command: show full-configuration
      register: backup_output

    - name: Save configuration to a local file
      ansible.builtin.copy:
        content: "{{ backup_output.stdout }}"
        dest: "./{{ inventory_hostname }}_{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}.conf"
      delegate_to: localhost
