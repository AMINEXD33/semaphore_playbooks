- name: BACKUP FORTIGATE CONFIGURATION
  hosts: FORTIGATE_DC
  gather_facts: false
  
  vars:
    # Use network_cli to drive the SSH connection
    ansible_connection: ansible.netcommon.network_cli
    # Requires 'fortinet.fortios' collection installed
    ansible_network_os: fortinet.fortios.fortios
    ansible_become: no
    
    # regex matches: "Press" ... "a" ... "to accept" (case insensitive)
    ansible_terminal_initial_prompt: '(?i).*Press.*a.*to accept.*'
    ansible_terminal_initial_answer: 'a'

  tasks:
    - name: Get running configuration from Fortigate
      ansible.netcommon.cli_command:
        command: show full-configuration
      register: fgt_config

    - name: Ensure backup directory exists
      delegate_to: localhost
      ansible.builtin.file:
        path: "/home/dxc-network/Bureau"
        state: directory
        mode: '0755'

    - name: Save configuration backup to local file
      delegate_to: localhost
      ansible.builtin.copy:
        content: "{{ fgt_config.stdout }}"
        dest: "/home/dxc-network/Bureau/{{ inventory_hostname }}_{{ lookup('pipe', 'date +%Y_%m_%d___%H_%M_%S') }}.cfg"
