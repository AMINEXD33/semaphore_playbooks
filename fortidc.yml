- name: BACKUP FORTIGATE CONFIGURATION
  hosts: "FORTIGATE_DC"
  gather_facts: false
  connection: local

  tasks:
    - name: Run SSH with sshpass to bypass TTY restrictions
      ansible.builtin.expect:
        # sshpass takes the password directly from the variable and feeds it to SSH
        command: "sshpass -p '{{ forti_password }}' ssh -T -o StrictHostKeyChecking=no {{ forti_username }}@{{ ansible_host }}"
        timeout: 30
        responses:
          # Now it skips the password prompt instantly and waits for the firewall prompt
          '# $': "show full-configuration"
      register: fgt_config

    - name: Save configuration backup to local file
      ansible.builtin.copy:
        content: "{{ fgt_config.stdout }}"
        dest: "/home/dxc-network/Bureau/{{ inventory_hostname }}_{{ lookup('pipe', 'date +%Y_%m_%d___%H_%M_%S') }}.cfg"
