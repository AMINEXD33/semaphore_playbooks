---
- name: BACKUP FORTIGATE CONFIGURATION
  hosts: FORTIGATE_DC
  gather_facts: false
  connection: local

  tasks:
    - name: Retrieve FortiGate configuration
      ansible.builtin.expect:
        command: >
          ssh -tt
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null
          {{ forti_username }}@{{ ansible_host }}
        timeout: 300
        echo: false
        responses:
          '(?i)password:': "{{ forti_password }}\n"
          '\(Press ''a'' to accept\):': "a\n"
          '.* \$': |
            config system console
            set output standard
            end
            show full-configuration
            exit
      register: fgt_config

    - name: Save configuration backup
      ansible.builtin.copy:
        content: "{{ fgt_config.stdout }}"
        dest: "/home/dxc-network/Bureau/{{ inventory_hostname }}_{{ lookup('pipe', 'date +%Y_%m_%d___%H_%M_%S') }}.cfg"
