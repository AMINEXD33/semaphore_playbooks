---
- name: BACKUP FORTIGATE CONFIGURATION
  hosts: FORTIGATE_DC
  gather_facts: false
  connection: local  # Critical: Run from the runner, do not use network_cli

  vars:
    ansible_python_interpreter: auto_silent

  tasks:
    - name: SSH, Accept Banner, and Get Config
      ansible.builtin.expect:
        # -T disables TTY to prevent hanging in Semaphore/CI environments
        command: "ssh -T -o StrictHostKeyChecking=no {{ ansible_user }}@{{ ansible_host }}"
        timeout: 30
        responses:
          # Handle Password
          '(?i)password:': "{{ ansible_ssh_pass }}"
          
          # Handle 'Press a to accept' banner (case insensitive)
          '(?i)Press.*a.*to accept': "a"
          
          # Handle the command prompt and send backup command
          '# $': "show full-configuration"
      register: fgt_config

    - name: Save configuration to local file
      ansible.builtin.copy:
        content: "{{ fgt_config.stdout }}"
        dest: "/home/dxc-network/Bureau/{{ inventory_hostname }}_{{ lookup('pipe', 'date +%Y_%m_%d___%H_%M_%S') }}.cfg"
