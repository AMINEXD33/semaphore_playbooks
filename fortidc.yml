- name: GETTING CONFIGURATION BACKUP
  hosts: FORTIGATE_DC
  gather_facts: false
  connection: local

  vars:
    backup_dir: "/home/dxc-network/Bureau"

  tasks:
    - name: Get FortiGate configuration
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:{{ forti_port }}/api/v2/..."
        method: GET
        headers:
          Authorization: "Bearer {{ api_key }}"
        validate_certs: false
      register: fgt_config
