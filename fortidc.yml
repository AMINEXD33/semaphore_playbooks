- name: GETTING CONFIGURATION BACKUP
  hosts: FORTIGATE_DC
  gather_facts: false
  connection: local
  vars:
    fgt_user: "{{ forti_username }}"
    fgt_pass: "{{ forti_password }}"
    backup_dir: "/home/dxc-network/Bureau"

  tasks:
    - name: Ensure backup directory exists
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: "0750"

    - name: Pull full configuration over SSH (exec mode, no interactive shell)
      ansible.builtin.shell: >
        sshpass -p '{{ fgt_pass }}'
        ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15
        {{ fgt_user }}@{{ ansible_host | default(inventory_hostname) }}
        "config system console; set output standard; end; show full-configuration" | sed -n '/#config-version=/,$p' > /tmp/fgt_clean_test.conf
      register: fgt_config
      changed_when: false
      no_log: true

    - name: Fail loudly if output looks empty or wrong (sanity check)
      ansible.builtin.fail:
        msg: >
          Config pull returned suspiciously little output ({{ fgt_config.stdout | length }} chars).
          Check auth, banner handling, or whether the disclaimer intercepted the session.
      when: fgt_config.stdout | length < 200

    - name: Save configuration backup to local file
      ansible.builtin.copy:
        content: "{{ fgt_config.stdout }}"
        dest: "{{ backup_dir }}/{{ inventory_hostname }}_{{ lookup('pipe', 'date +%Y_%m_%d___%H_%M_%S') }}.conf"
        mode: "0640"
