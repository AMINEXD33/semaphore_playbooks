
- name: GETTING CONFIGURATION BACKUP
  hosts: FORTIGATE_NONE
  gather_facts: false
  connection: local

  vars:
    backup_dir: "/home/dxc-network/Bureau"

  tasks:
  	- name: Backup FortiGate
      block:
        - name: Save configuration backup
          ansible.builtin.copy:
            content: "{{ fgt_config.content }}"
            dest: "{{ backup_dir }}/FortiGate_ONE_{{ now().strftime('%Y-%m-%d_%H-%M-%S') }}.conf"
            mode: "0640"
        
        - name: Write SUCCESS result
          ansible.builtin.copy:
            content: "{{ {
              'job': 'FortiGate DC Backup',
              'status': 'SUCCESS',
              'host': inventory_hostname,
              'ip': ansible_host,
              'timestamp': now().strftime('%Y-%m-%d %H:%M:%S')
            } | to_nice_json }}"
            dest: "/opt/semaphore/backup-results/fortigate_dc.json"
            mode: "0640"
    
	  rescue:
	    - name: Write FAILED result
          ansible.builtin.copy:
            content: "{{ {
              'job': 'FortiGate DC Backup',
              'status': 'FAILED',
              'host': inventory_hostname,
              'ip': ansible_host,
              'timestamp': now().strftime('%Y-%m-%d %H:%M:%S')
            } | to_nice_json }}"
            dest: "/opt/semaphore/backup-results/fortigate_dc.json"
            mode: "0640"


