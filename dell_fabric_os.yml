- name: GETTING CONFIGURATION BACKUP
  hosts: "{{ FILE_HOST_TARGET }}"
  gather_facts: false
  connection: local

  vars:
    backup_dir: "/home/dxc-network/Bureau"

  tasks:
    - name: Backup Dell fabric Os
      block:
        - name: Run Dell fabric script
          ansible.builtin.command:
            cmd: "/home/dxc-network/Bureau/custom_scripts/dell_fabric_os.sh"
          environment:
            DELL_HOST: "{{ ansible_host }}"
            DELL_USER: "{{ dell_user }}"
            DELL_PASS: "{{ dell_pass }}"
            SERVER_IP: "{{ server_ip }}"
            SERVER_USER: "{{ server_user }}"
            SERVER_PASS: "{{ server_pass }}"
            SERVER_PATH: "{{ server_path }}"
        
        - name: Write SUCCESS result
          ansible.builtin.copy:
            content: "{{ {
              'job': 'DELL FABRIC OS',
              'status': 'SUCCESS',
              'host': inventory_hostname,
              'ip': ansible_host,
              'timestamp': now().strftime('%Y-%m-%d %H:%M:%S')} | to_nice_json }}"
            dest: "{{ backup_dir }}/backup_results/{{FILE_HOST_TARGET}}.json"
            mode: "0640"
      rescue:
        - name: Write FAILED result
          ansible.builtin.copy:
            content: "{{ {
              'job': 'DELL FABRIC OS',
              'status': 'FAILED',
              'host': inventory_hostname,
              'ip': ansible_host,
              'timestamp': now().strftime('%Y-%m-%d %H:%M:%S')} | to_nice_json }}"
            dest: "{{ backup_dir }}/backup_results/{{FILE_HOST_TARGET}}.json"
            mode: "0640"
        - name: Fail the job
          ansible.builtin.fail:
            msg: "Dell device failed to backup"
