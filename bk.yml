- name: GETTING CONFIGURATION BACKUP
  hosts: SWITCH_CORE
  gather_facts: false
  become: true                    # Tell Ansible we need privilege escalation
  become_method: ansible.netcommon.enable  # <--- CRITICAL: Use Cisco 'enable' mode instead of Linux 'sudo'
  vars:
    ansible_network_os: cisco.ios
    ansible_connection: ansible.netcommon.network_cli
    
  tasks:
    - name: Get running configuration from Cisco switch
      cisco.ios.ios_command:
        commands:
          - show running-config
      register: switch_config

    - name: Save configuration backup to local file
      delegate_to: localhost
      ansible.builtin.copy:
        content: "{{ switch_config.stdout[0] }}"
        dest: "/home/dxc-network/Bureau/{{ inventory_hostname }}.cfg"
